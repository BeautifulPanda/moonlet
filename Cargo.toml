[package]
name = "moonlet"
version = "0.7.0"
edition = "2024"
license = "MIT"
description = "Lightweight, modular desktop customization for Windows"
publish = false

[features]
default = ["orbit", "music", "update", "launcher", "settings", "bluetooth", "timers", "notes", "scenarios"]
bluetooth = [
    "orbit",
    "windows/Devices_Radios",
    "windows/Foundation",
]
launcher = [
    "orbit",
    "windows/Foundation",
    "windows/Storage_Search",
    "windows/Win32_Storage_FileSystem",
    "windows/Win32_System_DataExchange",
    "windows/Win32_System_Memory",
    "windows/Win32_System_Shutdown",
]
timers = [
    "launcher",
    "windows/Win32_Media_Audio",
    "windows/Win32_System_SystemInformation",
    "windows/Win32_System_Time",
]
notes = [
    "windows/Win32_Graphics_Dwm",
    "windows/Win32_UI_Accessibility",
    "windows/Win32_UI_Controls",
    "windows/Win32_UI_Controls_RichEdit",
    "windows/Win32_UI_Input_KeyboardAndMouse",
]
scenarios = [
    "launcher",
    "windows/Win32_Graphics_Dwm",
    "windows/Win32_System_Com_StructuredStorage",
    "windows/Win32_System_Ole",
    "windows/Win32_System_Variant",
    "windows/Win32_UI_Accessibility",
    "windows/Win32_UI_Shell_PropertiesSystem",
]
update = [
    "windows/Win32_Networking_WinHttp",
    "windows/Win32_Security_Cryptography",
]
dev = []
music = [
    "orbit",
    "windows/Foundation",
    "windows/Media_Control",
    "windows/Storage_Streams",
    "windows/Win32_Graphics_Imaging",
    "windows/Win32_Media_Audio",
    "windows/Win32_Media_Audio_Endpoints",
    "windows/Win32_System_Com_StructuredStorage",
    "windows/Win32_System_Variant",
]
orbit = [
    "gfx",
    "windows/Win32_System_Performance",
    "windows/Win32_System_Power",
    "windows/Win32_System_SystemInformation",
    "windows/Win32_System_SystemServices",
    "windows/Win32_UI_Input_KeyboardAndMouse",
]
settings = [
    "gfx",
    "windows/Win32_Graphics_Dwm",
    "windows/Win32_UI_Shell_Common",
    "windows/Win32_System_DataExchange",
    "windows/Win32_System_Memory",
    "windows/Win32_UI_Controls",
    "windows/Win32_UI_Input_KeyboardAndMouse",
]
gfx = [
    "windows/Win32_Graphics_Direct2D",
    "windows/Win32_Graphics_Direct2D_Common",
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D11",
    "windows/Win32_Graphics_DirectComposition",
    "windows/Win32_Graphics_DirectWrite",
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_Graphics_Dxgi_Common",
    "dep:windows-numerics",
]

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[dependencies.windows-numerics]
version = "0.3"
optional = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
